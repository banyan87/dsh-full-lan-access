# dsh-full-lan-access bundle patch: the lan-access row, inserted into the
# composition of every profile that installs this package as a bundle.
#
# The row deliberately ships with NO config: the plugin fails closed at
# startup until `security.passwordHash` is set — a LAN gateway must never
# start unauthenticated. The failure message tells you exactly what to do.
#
# After `dsh plugin --profile <name> add dsh-full-lan-access`, configure the
# row from the profile's OWN patch layer (applied after every bundle layer;
# the row identity comes from this file, so you only override config):
#
#   # $DSH_HOME/profiles/web/cordis.patch.yml
#   - id: lan-access
#     config:
#       security:
#         passwordHash: 'scrypt$16384$8$1$...'   # from: dsh-lan-gate hash-password
#
# See https://github.com/banyan87/dsh-full-lan-access for the full
# configuration reference (docs/configuration.md).

- insert:
    - id: lan-access
      name: 'dsh-full-lan-access'

# ── browser-based directory picker ─────────────────────────────────────────
#
# DSH's adaptive picker (`directory-picker` → dsh-host-directory-picker-auto)
# resolves to the NATIVE OS chooser on desktop hosts, but a native dialog can
# only open on the host machine — useless (and silently broken) for browsers
# reaching DSH through the LAN gateway. This bundle pins the BROWSE pair
# instead: composing the pair directly is the documented way to fix the
# interaction. The browse picker is a web file browser that works from any
# browser, local or remote.
#
# To keep the native chooser for the host's own desktop, override these rows
# from the profile's own patch layer:
#
#   - id: directory-picker
#     disabled: false
#   - id: directory-picker-browse
#     disabled: true
#   - id: ui-directory-picker-browse
#     disabled: true

- id: directory-picker
  disabled: true

- insert:
    - id: directory-picker-browse
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
    - id: ui-directory-picker-browse
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'
